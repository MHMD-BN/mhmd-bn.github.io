<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تَثْبِيتْ - الأيام</title>
    <style>
        
        :root {
            --primary-green: #1d4b38;
            --secondary-green: #2d6a4f;
            --accent-gold: #c6a34f;
            --background-color: #f7f6f1;
            --text-color: #1b4332;
            --islamic-pattern: rgba(198, 163, 79, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--background-color);
            background-image: url('islamic.jpg');
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            padding: 3rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .methodology-container {
            position: relative;
            max-width: 1200px;
            margin: auto;
            padding: 5rem;
        }


        .timeline-path {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            z-index: 1;
            width: 100%;
            pointer-events: none;
        }

        .timeline-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .timeline-path-line {
            fill: none;
            stroke: url(#islamic-gradient);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px rgba(198, 163, 79, 0.3));
            opacity: 0.95;
        }

        .steps-container {
            position: relative;
            z-index: 2;
            margin: 0 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .step {
            margin-bottom: 5rem;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .step:nth-child(3n+1) {
            transform: translateX(-280px);
        }

        .step:nth-child(3n+2) {
            transform: translateX(0);
        }

        .step:nth-child(3n) {
            transform: translateX(280px);
        }

        .step-icon {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 3;
            background: linear-gradient(145deg, 
                var(--primary-green), 
                var(--secondary-green)
            );
            border: 6px double var(--accent-gold);
            box-shadow: 
                0 15px 35px rgba(29, 75, 56, 0.3),
                inset 0 2px 15px rgba(198, 163, 79, 0.4);
            opacity: 0.9;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .step-icon::before {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: 
                linear-gradient(45deg, 
                    transparent 45%, 
                    var(--accent-gold) 45%, 
                    var(--accent-gold) 55%, 
                    transparent 55%
                ),
                linear-gradient(-45deg, 
                    transparent 45%, 
                    var(--accent-gold) 45%, 
                    var(--accent-gold) 55%, 
                    transparent 55%
                );
            background-size: 15px 15px;
            opacity: 0.1;
            transform: scale(1.1);
            z-index: -1;
        }

        .step-icon::after {
            content: attr(data-surah);
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Amiri', 'Scheherazade New', serif;
            color: var(--accent-gold);
            font-size: 1.1rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            background: var(--primary-green);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--accent-gold);
            opacity: 0;
        }

        .step-icon:hover::after {
            opacity: 1;
        }

        .step-icon:hover {
            transform: scale(1.05);
        }

        .step-number {
            position: absolute;
            right: -20px;
            top: -20px;
            width: 55px;
            height: 55px;
            background: var(--primary-green);
            color: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.8rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            border: 3px solid var(--accent-gold);
            font-family: 'Amiri', 'Scheherazade New', serif;
        }

        .step-icon.active {
            opacity: 1;
            background: var(--accent-gold);
            box-shadow: 0 15px 35px rgba(198, 163, 79, 0.5);
        }

        .step-icon i {
            color: var(--accent-gold);
            font-size: 4rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.2));
        }

        @media (max-width: 1200px) {
            .step:nth-child(3n+1) { transform: translateX(-180px); }
            .step:nth-child(3n) { transform: translateX(180px); }
            .methodology-container { padding: 4rem; }

        @media (max-width: 768px) {
            .step:nth-child(3n+1) { transform: translateX(-120px); }

            .step-icon {

        @media (max-width: 480px) and (min-width: 355px) {

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    async function initializeUserData() {
        const userId = getCookie('userId');

        try {
            const userRef = doc(db, "users", userId);

                        });

            updateProgress();
        }

    <script>
    let active = 1;
        function updatePath() {
            const steps = document.querySelectorAll('.step-icon');
            const path = document.querySelector('.timeline-path-line');
            const container = document.querySelector('.methodology-container');
            
            let pathData = '';
            steps.forEach((step, index) => {
                const rect = step.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                
                const x = rect.left - containerRect.left + (rect.width / 2);
                const y = rect.top - containerRect.top + (rect.height / 2);
                
                if (index === 0) {
                    pathData += `M ${x} ${y}`;
                } else {
                    const prevRect = steps[index - 1].getBoundingClientRect();
                    const prevX = prevRect.left - containerRect.left + (prevRect.width / 2);
                    const prevY = prevRect.top - containerRect.top + (prevRect.height / 2);
                    
                    // Enhanced snake-like curve control
                    const curveIntensity = 150;
                    const midY = (prevY + y) / 2;
                    
                    if (index % 3 === 1) {
                        // Moving right
                        pathData += ` C ${prevX} ${midY}, ${x - curveIntensity} ${y}, ${x} ${y}`;
                    } else if (index % 3 === 2) {
                        // Moving left
                        pathData += ` C ${prevX + curveIntensity} ${prevY}, ${x - curveIntensity} ${y}, ${x} ${y}`;
                    } else {
                        // Moving center
                        pathData += ` C ${prevX - curveIntensity} ${prevY}, ${x + curveIntensity} ${y}, ${x} ${y}`;
                    }
                }
            });
            
            path.setAttribute('d', pathData);
        }

        // Update the SVG gradient
        const svg = document.querySelector('.timeline-svg');
        svg.innerHTML = `
            <defs>
                <linearGradient id="islamic-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color: var(--accent-gold); stop-opacity: 1"/>
                    <stop offset="25%" style="stop-color: var(--primary-green); stop-opacity: 0.8"/>
                    <stop offset="50%" style="stop-color: var(--accent-gold); stop-opacity: 1"/>
                    <stop offset="75%" style="stop-color: var(--primary-green); stop-opacity: 0.8"/>
                    <stop offset="100%" style="stop-color: var(--accent-gold); stop-opacity: 1"/>
                </linearGradient>

                <!-- Add decorative pattern -->
                <pattern id="islamic-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M0,10 L20,10 M10,0 L10,20" 
                          stroke="var(--accent-gold)" 
                          stroke-width="0.5" 
                          stroke-opacity="0.3"/>
                </pattern>
            </defs>
            <path class="timeline-path-line" />
        `;

        // Add resize observer for responsive updates
        const resizeObserver = new ResizeObserver(() => {
            updatePath();
        });

        resizeObserver.observe(document.querySelector('.methodology-container'));

        // Initial path update
        window.addEventListener('load', updatePath);
        window.addEventListener('resize', updatePath);
    </script>

    function updateProgress() {
        const activeSteps = document.querySelectorAll('.step-icon.active');
        const pagesPerDay = window.pagesPerDay || 1;
        const memorizedPages = Math.max(0, (activeSteps.length * pagesPerDay) - pagesPerDay);
        
        document.getElementById('memorized-pages-count').textContent = memorizedPages;
        
        const progressPercentage = (memorizedPages / 20) * 100;
        const progressBar = document.querySelector('.progress-bar');
        if (progressBar) {
            progressBar.style.width = `${progressPercentage}%`;
        }
    }
