<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراجعة - قريباً - تَثْبِيتْ</title>
    <link rel="shortcut icon" href="../original.png" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background:linear-gradient(120deg, rgba(0, 192, 157, 0.1), rgba(45, 135, 176, 0.1)), url('../islamic.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .container {
            background-color: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #00c09d, #2D87B0, #00c09d);
        }
        
        .message {
            color: #2c3e50;
            line-height: 1.8;
            margin-bottom: 2rem;
        }
        
        h1 {
            color: #00c09d;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        
        .btn {
            background: linear-gradient(45deg, #00c09d, #2D87B0, #00c09d);
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 50px;
            display: inline-block;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0,123,255,0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,123,255,0.3);
            background: linear-gradient(45deg, #00c09d, #2D87B0, #00c09d);
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 1rem;
                padding: 2rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="message">
            <h1>قريباً</h1>
            <p>عذراً، الجزء الخاص بالمراجعة لم يكتمل بعد وسيكون متاحاً قريباً.</p>
            <p>في الوقت الحالي، ننصحك بزيارة صفحة الخطط واختيار خطة أكبر للمراجعة حتى يتوفر هذا القسم.</p>
        </div>
        <a href="../plans/plans.html" class="btn">الذهاب إلى صفحة الخطط</a>
    </div>
</body>
</html>
