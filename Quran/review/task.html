        #checklist {
  --background: #ffffff;
  --text: #414856;
  --check: #4F29F0;
  --disabled: #C3C8DE;
  --width: 100px;
  --height: 140px;
  --border-radius: 10px;
  background: var(--background);
  border-radius: var(--border-radius);
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50% , -50%);
  box-shadow: 0 10px 30px rgba(65, 72, 86, 0.05);
  padding: 30px 45px;
  display: grid;
  grid-template-columns: 30px auto;
  align-items: center;
  
}
#checklist label {
  color: var(--text);
  position: relative;
  cursor: pointer;
  display: grid;
  align-items: center;
  width: -webkit-fit-content;
  width: -moz-fit-content;
  width: fit-content;
  transition: color 0.3s ease;
}
#checklist label::before, #checklist label::after {
  content: "";
  position: absolute;
}
#checklist label::before {
  height: 2px;
  width: 8px;
  left: -27px;
  background: var(--check);
  border-radius: 2px;
  transition: background 0.3s ease;
}
#checklist label:after {
  height: 4px;
  width: 4px;
  top: 8px;
  left: -25px;
  border-radius: 50%;
}
#checklist input[type=checkbox] {
  -webkit-appearance: none;
  -moz-appearance: none;
  position: relative;
  height: 15px;
  width: 15px;
  outline: none;
  border: 0;
  margin: 0 15px 0 0;
  cursor: pointer;
  background: var(--background);
  display: grid;
  align-items: center;
}
#checklist input[type=checkbox]::before, #checklist input[type=checkbox]::after {
  content: "";
  position: absolute;
  height: 2px;
  top: auto;
  background: var(--check);
  border-radius: 2px;
}
#checklist input[type=checkbox]::before {
  width: 0px;
  right: 60%;
  transform-origin: right bottom;
}
#checklist input[type=checkbox]::after {
  width: 0px;
  left: 40%;
  transform-origin: left bottom;
}
#checklist input[type=checkbox]:checked::before {
  -webkit-animation: check-01 0.4s ease forwards;
          animation: check-01 0.4s ease forwards;
}
#checklist input[type=checkbox]:checked::after {
  -webkit-animation: check-02 0.4s ease forwards;
          animation: check-02 0.4s ease forwards;
}
#checklist input[type=checkbox]:checked + label {
  color: var(--disabled);
  -webkit-animation: move 0.3s ease 0.1s forwards;
          animation: move 0.3s ease 0.1s forwards;
}
#checklist input[type=checkbox]:checked + label::before {
  background: var(--disabled);
  -webkit-animation: slice 0.4s ease forwards;
          animation: slice 0.4s ease forwards;
}
#checklist input[type=checkbox]:checked + label::after {
  -webkit-animation: firework 0.5s ease forwards 0.1s;
          animation: firework 0.5s ease forwards 0.1s;
}

@-webkit-keyframes move {
  50% {
    padding-left: 8px;
    padding-right: 0px;
  }
  100% {
    padding-right: 4px;
  }
}

@keyframes move {
  50% {
    padding-left: 8px;
    padding-right: 0px;
  }
  100% {
    padding-right: 4px;
  }
}
@-webkit-keyframes slice {
  60% {
    width: 100%;
    left: 4px;
  }
  100% {
    width: 100%;
    left: -2px;
    padding-left: 0;
  }
}
@keyframes slice {
  60% {
    width: 100%;
    left: 4px;
  }
  100% {
    width: 100%;
    left: -2px;
    padding-left: 0;
  }
}
@-webkit-keyframes check-01 {
  0% {
    width: 4px;
    top: auto;
    transform: rotate(0);
  }
  50% {
    width: 0px;
    top: auto;
    transform: rotate(0);
  }
  51% {
    width: 0px;
    top: 8px;
    transform: rotate(45deg);
  }
  100% {
    width: 5px;
    top: 8px;
    transform: rotate(45deg);
  }
}
@keyframes check-01 {
  0% {
    width: 4px;
    top: auto;
    transform: rotate(0);
  }
  50% {
    width: 0px;
    top: auto;
    transform: rotate(0);
  }
  51% {
    width: 0px;
    top: 8px;
    transform: rotate(45deg);
  }
  100% {
    width: 5px;
    top: 8px;
    transform: rotate(45deg);
  }
}
@-webkit-keyframes check-02 {
  0% {
    width: 4px;
    top: auto;
    transform: rotate(0);
  }
  50% {
    width: 0px;
    top: auto;
    transform: rotate(0);
  }
  51% {
    width: 0px;
    top: 8px;
    transform: rotate(-45deg);
  }
  100% {
    width: 10px;
    top: 8px;
    transform: rotate(-45deg);
  }
}
@keyframes check-02 {
  0% {
    width: 4px;
    top: auto;
    transform: rotate(0);
  }
  50% {
    width: 0px;
    top: auto;
    transform: rotate(0);
  }
  51% {
    width: 0px;
    top: 8px;
    transform: rotate(-45deg);
  }
  100% {
    width: 10px;
    top: 8px;
    transform: rotate(-45deg);
  }
}
@-webkit-keyframes firework {
  0% {
    opacity: 1;
    box-shadow: 0 0 0 -2px #4F29F0, 0 0 0 -2px #4F29F0, 0 0 0 -2px #4F29F0, 0 0 0 -2px #4F29F0, 0 0 0 -2px #4F29F0, 0 0 0 -2px #4F29F0;
  }
  30% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    box-shadow: 0 -15px 0 0px #4F29F0, 14px -8px 0 0px #4F29F0, 14px 8px 0 0px #4F29F0, 0 15px 0 0px #4F29F0, -14px 8px 0 0px #4F29F0, -14px -8px 0 0px #4F29F0;
  }
}
@keyframes firework {
  0% {
    opacity: 1;
    box-shadow: 0 0 0 -2px #4F29F0, 0 0 0 -2px #4F29F0, 0 0 0 -2px #4F29F0, 0 0 0 -2px #4F29F0, 0 0 0 -2px #4F29F0, 0 0 0 -2px #4F29F0;

  30% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    box-shadow: 0 -15px 0 0px #4F29F0, 14px -8px 0 0px #4F29F0, 14px 8px 0 0px #4F29F0, 0 15px 0 0px #4F29F0, -14px 8px 0 0px #4F29F0, -14px -8px 0 0px #4F29F0;
  }
}

@media (min-width: 1200px) {

        font-size: 3.5em; /* Increase timer number size for larger screens */
    }
}

/* Media query for screens smaller than 992px (typical desktops/laptops) but larger than tablets */
@media (max-width: 992px) and (min-width: 769px) {
    #countdown-timer {
        font-size: 1.8em; /* Adjust font size for mid-sized screens */
        padding: 35px 20px; /* Adjust padding */
        border-radius: 18px; /* Adjust border-radius */
        margin-top: 25px; /* Adjust margin */
    }

    #countdown-timer span {
        font-size: 3em; /* Keep timer number size consistent or adjust slightly */
    }
}

/* Media query for screens smaller than 768px (tablets) */
@media (max-width: 768px) {
    #countdown-timer {
        font-size: 1.5em;
        padding: 30px 15px;
        border-radius: 15px;
        margin-top: 20px;
        max-width: 90%;
    }

    #countdown-timer span {
        font-size: 2.2em; /* Slightly reduced timer number size for tablets */
    }
    #checklist {
      width: 82%;
        padding: 25px 40px; /* Slightly increased checklist padding for tablets */
    }
}

/* Media query for screens smaller than 576px (smaller tablets and large phones) */
@media (max-width: 576px) {
    #countdown-timer {
        font-size: 1.3em; /* Slightly larger than mobile, for larger phones/small tablets */
        padding: 25px 12px; /* Further reduce padding */
        border-radius: 12px;
        margin-top: 18px;
    }

    #countdown-timer span {
        font-size: 2.1em;
    }
}

@media (max-width: 480px) {
    #countdown-timer {
        font-size: 1.1em;

        margin-top: 15px;
    }

    #countdown-timer span {
        font-size: 1.8em;
    }

    #checklist {
        padding: 15px 25px;
    }
}

function incrementDayInDatabase() {

function startCountdown(targetTime) {
    const timerDisplay = document.getElementById('timer');
    const checklistDiv = document.getElementById('checklist');
    const countdownTimerDiv = document.getElementById('countdown-timer');

    function updateTimer() {
        const now = new Date();
        let diff = targetTime - now.getTime();

        if (diff <= 0) {
            clearInterval(intervalId);
            timerDisplay.textContent = 'انتهى!';
            checklistDiv.style.display = 'block';
            countdownTimerDiv.style.display = 'none';
            localStorage.removeItem('lastChecklistCompletionTime');
            fetchUserDataAndDisplay();
            return;
        }

        let hours = Math.floor(diff / (1000 * 60 * 60));
        let minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        let seconds = Math.floor((diff % (1000 * 60)) / 1000);

        timerDisplay.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    updateTimer();
    const intervalId = setInterval(updateTimer, 1000);
}

// استدعاء الدالة عند تحميل الصفحة
window.addEventListener('DOMContentLoaded', function() {
    fetchUserDataAndDisplay();
    const lastCompletionTime = localStorage.getItem('lastChecklistCompletionTime');
    if (lastCompletionTime) {
        const timeDiff = new Date().getTime() - parseInt(lastCompletionTime, 10);
        const twentyFourHours = 24 * 60 * 60 * 1000;
        if (timeDiff < twentyFourHours) {
            document.getElementById('checklist').style.display = 'none';
            document.getElementById('countdown-timer').style.display = 'block';
            const targetTime = parseInt(lastCompletionTime, 10) + twentyFourHours;
            startCountdown(targetTime);
        } else {
            localStorage.removeItem('lastChecklistCompletionTime');
        }
    }
});

document.getElementById('checklist').addEventListener('change', function(event) {

        const checkboxes = document.querySelectorAll('#checklist input[type="checkbox"]');

        checkboxes.forEach((checkbox) => {
            if (!checkbox.checked) {
                allChecked = false;
            }
        });
        if (allChecked) {
            incrementDayInDatabase();
        }
    }
});
