<script type="module">
  // Import Firebase functions
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyDQeWpg4bkUMyAir76OLl4-4d9cFExx37Q",
      authDomain: "quran-11747.firebaseapp.com",
      projectId: "quran-11747",
      storageBucket: "quran-11747.firebasestorage.app",
      messagingSenderId: "484969787827",
      appId: "1:484969787827:web:fd2b841c1a513a0816dbc6",
      measurementId: "G-ZNC30E63VL"
    };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Function to get cookie value
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }

  // Add click event listeners to all items
  document.querySelectorAll('.ag-courses_item').forEach(item => {
    item.addEventListener('click', async function(e) {
      e.preventDefault();
      
      const planId = this.id;
      const userId = getCookie('userId');
      
      if (!userId) {
        Swal.fire({
          icon: 'warning',
          title: 'تنبيه',
          text: 'الرجاء تسجيل الدخول أولاً',
          confirmButtonText: 'حسناً',
          confirmButtonColor: '#3085d6',
        }).then(() => {
          window.location.href = '../loginAndsignup.html';
        });
        return;
      }

      try {
        // Show elegant loading message with progress bar
        Swal.fire({
          title: 'جاري إنشاء الخطة',
          html: '<div class="loading-text">نقوم بتجهيز خطة الحفظ الخاصة بك...</div>',
          timer: 3000,
          timerProgressBar: true,
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          },
          background: '#fff',
          customClass: {
            title: 'custom-swal-title',
            popup: 'custom-swal-popup'
          }
        });

        // Save the selected plan
        await setDoc(doc(db, "users", userId), {
          selectedPlan: planId,
          currentPart: 1,
          currentDay: 1,
          totalPages: 0,
          updatedAt: new Date()
        }, { merge: true });

        // Wait for 2 seconds
        await new Promise(resolve => setTimeout(resolve, 2000));

        // Show success message with animation
        await Swal.fire({
          icon: 'success',
          title: 'تم إنشاء الخطة بنجاح! 🎉',
          html: '<div class="success-text">تم تجهيز خطة الحفظ الخاصة بك</div>' +
                '<div class="redirect-text">سيتم تحويلك إلى الصفحة الرئيسية</div>',
          showConfirmButton: false,
          timer: 2500,
          timerProgressBar: true,
          background: '#fff',
          customClass: {
            popup: 'custom-swal-popup',
            title: 'custom-swal-title',
            icon: 'custom-swal-icon'
          }
        });

        window.location.href = '../index.html';
      } catch (error) {
        console.error("Error saving plan: ", error);
        Swal.fire({
          icon: 'error',
          title: 'عذراً!',
          text: 'حدث خطأ أثناء حفظ الخطة',
          confirmButtonText: 'حاول مرة أخرى',
          confirmButtonColor: '#d33',
          customClass: {
            popup: 'custom-swal-popup',
            title: 'custom-swal-title'
          }
        });
      }
    });
  });
</script>
