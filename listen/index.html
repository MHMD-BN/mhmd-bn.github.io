<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>السماع الممنهج للقرآن الكريم</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<style>

* {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: url('background.jpg') no-repeat center center fixed;
  background-size: cover;
  min-height: 100vh;
}
*:focus {
  outline: none;
}

#player-container {
  position: absolute;
  top: 50%;
  right: 0;
  left: 0;
  width: 90%;
  max-width: 450px;
  height: 120px;
  margin: -4px auto;
  transform: translateY(-50%);
  background: rgba(255, 255, 255, 0.95);
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  padding: 15px;
  z-index: 999;
}

#player-bg-artwork {
  position: fixed;
  top: -30px;
  right: -30px;
  bottom: -30px;
  left: -30px;
  background-image: url("https://raw.githubusercontent.com/himalayasingh/music-player-1/master/img/_1.jpg");
  background-repeat: no-repeat;
  background-size: cover;
  background-position: 50%;
  filter: blur(40px);
  -webkit-filter: blur(40px);
  z-index: 1;
}

#player-bg-layer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background-color: #fff;
  opacity: 0.5;
  z-index: 2;
}

#player {
  position: relative;
  height: 100%;
  z-index: 3;
}

#player-track {
  position: absolute;
  top: 0;
  right: 15px;
  left: 15px;
  padding: 13px 22px 10px 184px;
  background-color: #fff7f7;
  border-radius: 15px 15px 0 0;
  transition: 0.3s ease top;
  z-index: 1;
}

#player-track.active {
  top: -105px;
  height: 100px;
}

#album-name {
  color: #54576f;
  font-size: 17px;
  font-weight: bold;
}

#track-name {
  color: #acaebd;
  font-size: 13px;
  margin: 2px 0 13px 0;
}

#track-time {
  height: 12px;
  margin-bottom: 3px;
  overflow: hidden;
}

#current-time {
  float: left;
}

#track-length {
  float: right;
}

#current-time,
#track-length {
  color: #f86d92;
  font-size: 11px;
  border-radius: 10px;
  transition: 0.3s ease all;
}

#track-time.active #current-time,
#track-time.active #track-length {
  color: #f86d92;
  background-color: transparent;
}

#seek-bar-container,
#seek-bar {
  position: relative;
  height: 4px;
  border-radius: 4px;
}

#seek-bar-container {
  background-color: #e0e3e9;
  cursor: pointer;
}

#seek-time {
  position: absolute;
  top: -29px;
  color: #fff;
  font-size: 12px;
  white-space: pre;
  padding: 5px 6px;
  border-radius: 4px;
  display: none;
}

#s-hover {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  opacity: 0.2;
  z-index: 2;
}

#seek-time,
#s-hover {
  background-color: #3b3d50;
}

#seek-bar {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 0;
  background: linear-gradient(135deg, #3e4684 0%, #2a2f5b 100%);
  transition: 0.2s ease width;
  z-index: 1;
}

#player-content {
  position: relative;
  height: 100%;
  background-color: #fff;
  box-shadow: 0 30px 80px #656565;
  border-radius: 15px;
  z-index: 2;
}

#album-art {
  position: absolute;
  top: -50px;
  width: 120px;
  height: 120px;
  margin-left: 40px;
  transform: rotateZ(0);
  transition: 0.3s ease all;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  border: 3px solid #fff;
  border-radius: 50%;
  overflow: hidden;
}

#album-art.active {
  top: -60px;
  box-shadow: 0 0 0 4px #fff7f7, 0 30px 50px -15px #afb7c1;
}

#album-art:before {
  content: "";
  position: absolute;
  top: 50%;
  right: 0;
  left: 0;
  width: 20px;
  height: 20px;
  margin: -10px auto 0 auto;
  background-color: #d6dee7;
  border-radius: 50%;
  box-shadow: inset 0 0 0 2px #fff;
  z-index: 2;
}

#album-art img {
  display: block;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  z-index: -1;
}

#album-art img.active {
  opacity: 1;
  z-index: 1;
}

#album-art.active img.active {
  z-index: 1;
  animation: rotateAlbumArt 3s linear 0s infinite forwards;
}

@keyframes rotateAlbumArt {
  0% {
    transform: rotateZ(0);
  }
  100% {
    transform: rotateZ(360deg);
  }
}

#buffer-box {
  position: absolute;
  top: 50%;
  right: 0;
  left: 0;
  height: 13px;
  color: #1f1f1f;
  font-size: 13px;
  font-family: Helvetica;
  text-align: center;
  font-weight: bold;
  line-height: 1;
  padding: 6px;
  margin: -12px auto 0 auto;
  background-color: rgba(255, 255, 255, 0.19);
  opacity: 0;
  z-index: 2;
}

#album-art img,
#buffer-box {
  transition: 0.1s linear all;
}

#album-art.buffering img {
  opacity: 0.25;
}

#album-art.buffering img.active {
  opacity: 0.8;
  filter: blur(2px);
  -webkit-filter: blur(2px);
}

#album-art.buffering #buffer-box {
  opacity: 1;
}

#player-controls {
  width: 250px;
  height: 100%;
  margin: 0 5px 0 141px;
  float: right;
  overflow: hidden;
  display: flex;
    justify-content: space-between;
    align-content: center;
    align-items: center;
}

.control {
  width: 33.333%;
  float: left;
  padding: 12px 0;
}

.button {
  width: 30px;
  height: 30px;
  padding: 20px;
  background-color: #fff;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
  transition: all 0.3s ease;
}

.button i {
  display: block;
  color: #3e4684;
  font-size: 26px;
  text-align: center;
  line-height: 1;
}

.button,
.button i {
  transition: 0.2s ease all;
}

.button:hover {
  transform: scale(1.1);
  box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
}


/* إضافة أنماط الرسالة */
#completion-message {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.7);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.message-box {
  background: linear-gradient(135deg, #3e4684 0%, #2a2f5b 100%);
  color: white;
  padding: 2.5rem;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
}

.message-box h2 {
  color: #fff;
  margin-bottom: 1rem;
  font-size: 1.8rem;
}

.message-box p {
  color: rgba(255, 255, 255, 0.9);
  font-size: 1.1rem;
}

#close-message {
  background: #fff;
  color: #3e4684;
  transition: all 0.3s ease;
  border: none;
  padding: 0.5rem 1.5rem;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 1rem;
  font-size: 1rem;
}

#close-message:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
}

/* إضافة أنماط الشعلة وعداد الأيام */
#streak-container {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 10000;
  background: rgba(255, 255, 255, 0.95);
  padding: 10px 15px;
  border-radius: 25px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
}

#streak-flame {
  font-size: 24px;
  color: #ff6b6b;
  transition: 0.3s ease all;
  animation: flame 1.5s infinite alternate;
}

@keyframes flame {
  0% { transform: scale(1); }
  100% { transform: scale(1.1); }
}

#streak-flame.inactive {
  color: #ccc;
}

#streak-count {
  font-size: 18px;
  font-weight: bold;
  color: #333;
  background-color: rgba(255, 255, 255, 0.8);
  padding: 5px 10px;
  border-radius: 5px;
}

/* Improved responsive styles */

  #player-container {
    max-width: 380px;

  }

  }

  }

}

@media (max-width: 480px) {

@media (max-width: 360px) {

  }
}

<div class="screen-1">
  <div class="shakh">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
$(function () {
    // Add these variables at the top
    const loginScreen = $("#logIn");
    const loginButton = $(".login");
    const sheikhSelect = $(".shakh select");
    const pagesInput = $(".number input");
    
    // Check login status immediately
    function checkLoginStatus() {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if (isLoggedIn === 'true') {
            loginScreen.hide();
            // Load saved preferences
            const savedSheikh = localStorage.getItem('selectedSheikh') || 'Minshawy_Murattal_128kbps';
            const savedPages = parseInt(localStorage.getItem('pagesPerSession')) || 2;
            // Update global variables with saved preferences
            window.pagesPerSession = savedPages;
            window.currentSheikh = savedSheikh;
            // Update track name with selected sheikh
            updateTrackName(savedSheikh);
        } else {
            loginScreen.show();
        }
    }

    // Add this new function to get readable sheikh name
    function getSheikhReadableName(sheikhValue) {
        const sheikhMap = {
            'Abdul_Basit_Murattal_64kbps': 'عبد الباسط عبد الصمد (مرتل)',
            'Abdul_Basit_Mujawwad_128kbps': 'عبد الباسط عبد الصمد (مجود)',
            'Abdullah_Basfar_64kbps': 'عبد الله بصفر',
            'Abdurrahmaan_As-Sudais_64kbps': 'عبد الرحمن السديس',
            'Ahmed_ibn_Ali_al-Ajamy_64kbps_QuranExplorer.Com': 'أحمد بن علي العجمي',
            'Alafasy_64kbps': 'العفاسي',
            'Husary_64kbps': 'الحصري (مرتل)',
            'Husary_Mujawwad_64kbps': 'الحصري (مجود)',
            'Hudhaify_64kbps': 'الحزيفي',
            'Menshawi_32kbps': 'المنشاوي (مرتل)',
            'Minshawy_Mujawwad_64kbps': 'المنشاوي (مجود)',
            'Mohammad_al_Tablaway_64kbps': 'الطبلاوي',
            'Muhammad_Ayyoub_64kbps': 'محمد أيوب',
            'Muhammad_Jibreel_64kbps': 'محمد جبريل',
            'Mustafa_Ismail_48kbps': 'مصطفي أسماعيل',
            'Saood_ash-Shuraym_64kbps': 'سعود الشريم',
            'mahmoud_ali_al_banna_32kbps': 'محمود علي البنا',
            'Yasser_Ad-Dussary_128kbps': 'ياسر الدسري',
            'Nasser_Alqatami_128kbps': 'ناصر القطامي'
        };
        return sheikhMap[sheikhValue] || sheikhValue;
    }

    // Add this new function to update track name
    function updateTrackName(sheikhValue) {
        const readableName = getSheikhReadableName(sheikhValue);
        $('#track-name').text(readableName);
    }

    // Modify the login button click handler
    loginButton.on('click', function() {
        const selectedSheikh = sheikhSelect.val();
        const selectedPages = parseInt(pagesInput.val());
        
        if (selectedPages) {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('selectedSheikh', selectedSheikh);
            localStorage.setItem('pagesPerSession', selectedPages);
            
            window.pagesPerSession = selectedPages;
            window.currentSheikh = selectedSheikh;
            
            // Update track name with selected sheikh
            updateTrackName(selectedSheikh);
            
            loginScreen.hide();
            
            currentPage = 0;
            pages = loadPages();
            playPages();
        } else {
            Swal.fire({
                icon: 'error',
                title: 'خطأ في الإدخال',
                text: 'الرجاء إدخال عدد صفحات صحيح بين 1 و 604',
                confirmButtonText: 'حسناً'
            });
            localStorage.setItem('isLoggedIn', 'false');
        }
    });

    // Modify the loadPages function to use the selected sheikh
    function loadPages() {
        const pagesToLoad = [];
        for (let i = 0; i < window.pagesPerSession; i++) {
            if (currentPage < totalPages) {
                pagesToLoad.push(`https://everyayah.com/data/${window.currentSheikh}/PageMp3s/Page${String(currentPage + 1).padStart(3, '0')}.mp3`);
                currentPage++;
            }
        }
        return pagesToLoad;
    }

    // Call checkLoginStatus at startup
    checkLoginStatus();

    // Elements
    const playerTrack = $("#player-track");
    const albumArt = $("#album-art");
    const playPauseButton = $("#play-pause-button");
    const playPreviousTrackButton = $("#play-previous");
    const playNextTrackButton = $("#play-next");
    const seekBar = $("#seek-bar");
    const currentTime = $("#current-time");
    const trackLength = $("#track-length");
    const i = playPauseButton.find("i");

    // Variables
    const totalPages = 604;
    let currentPage = 0;
    let pages = [];
    let isPlaying = false;
    let audio = new Audio();

    // Variables for streak tracking
    const streakKey = 'quranStreak';
    const maxHoursBetweenSessions = 30;
    let streakCount = 0;
    let lastSessionTime = null;

    async function getSurahName(pageNumber) {
        try {
            const response = await fetch(`https://api.alquran.cloud/v1/page/${pageNumber}/ar.alafasy`);
            const data = await response.json();
            
            if (data.status === 'OK') {
                const firstAyah = data.data.ayahs[0];
                const lastAyah = data.data.ayahs[data.data.ayahs.length-1];
                return `${firstAyah.surah.name}`;
            }
            return "القرآن الكريم";
        } catch (error) {
            console.error('Error fetching surah name:', error);
            return "القرآن الكريم";
        }
    }

    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
    }

    function updateProgress() {
        if (!isNaN(audio.duration)) {
            const progress = (audio.currentTime / audio.duration) * 100;
            seekBar.css('width', `${progress}%`);
            currentTime.text(formatTime(audio.currentTime));
            trackLength.text(formatTime(audio.duration));
        }
        if (isPlaying) {
            requestAnimationFrame(updateProgress);
        }
    }

    async function playPages() {
        if (pages.length > 0) {
            try {
                // Get surah name using the actual page number being played
                const pageNumber = currentPage - pages.length + 1;
                const surahName = await getSurahName(pageNumber);
                $('#album-name').text(surahName);

                audio.src = pages[0];
                await audio.play();
                
                isPlaying = true;
                playerTrack.addClass("active");
                albumArt.addClass("active");
                i.attr("class", "fas fa-pause");
                updateProgress();
            } catch (error) {
                console.error('Error playing audio:', error);
            }
            
            audio.onended = function() {
                pages.shift();
                if (pages.length > 0) {
                    playPages();
                } else {
                    // Check if we reached the last page (604)
                    if (currentPage >= 604) {
                        currentPage = 0; // Reset to page 1
                    }
                    
                    localStorage.setItem('currentDay', currentPage);
                    isPlaying = false;
                    i.attr("class", "fas fa-play");
                    playerTrack.removeClass("active");
                    albumArt.removeClass("active");
                    showCompletionMessage();
                    updateStreak();
                }
            };
        }
    }

    function startListening() {
        const completedPages = localStorage.getItem('currentDay') || 0;
        currentPage = parseInt(completedPages, 10);
        pages = loadPages();
        playPages();
    }

    // Event Listeners
    playPauseButton.on("click", function() {
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
            i.attr("class", "fas fa-play");
            playerTrack.removeClass("active");
            albumArt.removeClass("active");
        } else {
            if (pages.length === 0) {
                startListening();
            } else {
                audio.play();
                isPlaying = true;
                i.attr("class", "fas fa-pause");
                playerTrack.addClass("active");
                albumArt.addClass("active");
                updateProgress();
            }
        }
    });

    playPreviousTrackButton.on("click", function() {
        if (currentPage > pagesPerSession) {
            currentPage -= (pagesPerSession * 2);
            pages = loadPages();
            playPages();
        }
    });

    playNextTrackButton.on("click", function() {
        if (currentPage < totalPages) {
            pages = loadPages();
            playPages();
        }
    });

    $("#seek-bar-container").on("click", function(e) {
        if (!isNaN(audio.duration)) {
            const container = $(this);
            const clickPosition = (e.pageX - container.offset().left) / container.width();
            audio.currentTime = clickPosition * audio.duration;
        }
    });

    // إضافة حدث إغلاق الرسالة
    $('#close-message').on('click', function() {
        $('#completion-message').fadeOut();
    });

    function updateStreak() {
        const now = new Date();
        const storedStreak = localStorage.getItem(streakKey);
        
        
        if (storedStreak) {
            const { count, lastTime } = JSON.parse(storedStreak);
            const hoursSinceLast = (now - new Date(lastTime)) / (1000 * 60 * 60);
            
            if (hoursSinceLast <= maxHoursBetweenSessions) {
                streakCount = count + 1;
            } else {
                streakCount = 1;
                $('#streak-flame').addClass('inactive');
            }
        } else {
            streakCount = 1;
        }

        // Update UI
        $('#streak-count').text(streakCount);
        if (streakCount > 0) {
            $('#streak-flame').removeClass('inactive');
        }

        // Save new streak data
        localStorage.setItem(streakKey, JSON.stringify({
            count: streakCount,
            lastTime: now.toISOString()
        }));
    }

    // Initialize
    function initializeStreak() {
        const storedStreak = localStorage.getItem(streakKey);
        if (storedStreak) {
            const { count } = JSON.parse(storedStreak);
            streakCount = count;
            $('#streak-count').text(streakCount);
            if (streakCount > 0) {
                $('#streak-flame').removeClass('inactive');
            }
        }
    }

    initializeStreak();
    startListening();

    // Add these event listeners
    $('#edit-settings').on('click', function() {
        $('#settings-modal').fadeIn();
        $('#edit-sheikh').val(window.currentSheikh);
        $('#edit-pages').val(window.pagesPerSession);
        $('#start-page').val(currentPage + 1);
    });

    $('#close-settings').on('click', function(e) {
        e.preventDefault();
        $('#settings-modal').fadeOut();
    });

    $('#save-settings').on('click', function(e) {
        e.preventDefault();
        
        const newSheikh = $('#edit-sheikh').val();
        const newPages = $('#edit-pages').val();
        const startPage = $('#start-page').val();

        if (!newPages || !startPage) {
            Swal.fire({
                icon: 'error',
                title: 'خطأ في الإدخال',
                text: 'الرجاء التأكد من ملء جميع الحقول بشكل صحيح',
                confirmButtonText: 'حسناً'
            });
            localStorage.setItem('isLoggedIn', 'false');
            loginScreen.show();
            return;
        }

        // تحويل القيم إلى أرقام
        const pagesNum = parseInt(newPages);
        const startPageNum = parseInt(startPage);


        // تحديث الإعدادات
        window.currentSheikh = newSheikh;
        window.pagesPerSession = pagesNum;
        currentPage = startPageNum === 604 ? 0 : startPageNum - 1;

        // حفظ في localStorage
        localStorage.setItem('selectedSheikh', newSheikh);
        localStorage.setItem('pagesPerSession', pagesNum);
        localStorage.setItem('currentDay', currentPage);

        // تحديث واجهة المستخدم
        updateTrackName(newSheikh);
        pages = loadPages();
        
        getSurahName(startPageNum).then(surahName => {
            $('#album-name').text(surahName);
        });
        
        $('#settings-modal').fadeOut();
    });

    // تعديل معالج حدث زر "اختر لي"
    $('#default-settings').on('click', function(e) {
        e.preventDefault();
        $('#edit-sheikh').val('Menshawi_32kbps');
        $('#edit-pages').val('10');
        $('#start-page').val('1');
    });

    // Add this event listener for default settings button in login screen
    $('#default-settings-login').on('click', function() {
        $('.shakh select').val('Menshawi_32kbps');
        $('.number input').val(10);
    });

    // Add dark theme toggle functionality
    const themeToggle = $('#theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'light';
    
    if (currentTheme === 'dark') {
        document.body.classList.add('dark-theme');
        themeToggle.removeClass('fa-moon').addClass('fa-sun');
    }

    themeToggle.on('click', function() {
        document.body.classList.toggle('dark-theme');
        if (document.body.classList.contains('dark-theme')) {
            localStorage.setItem('theme', 'dark');
            themeToggle.removeClass('fa-moon').addClass('fa-sun');
        } else {
            localStorage.setItem('theme', 'light');
            themeToggle.removeClass('fa-sun').addClass('fa-moon');
        }
    });

    // Add this to the JavaScript section:
    $('#logout').on('click', function(e) {
        e.preventDefault();
        Swal.fire({
            title: 'هل أنت متأكد من تسجيل الخروج؟',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'نعم، سجل خروج',
            cancelButtonText: 'إلغاء'
        }).then((result) => {
            if (result.isConfirmed) {
                // Clear login status
                localStorage.removeItem('isLoggedIn');
                // Reset current page
                currentPage = 0;
                localStorage.setItem('currentDay', currentPage);
                // Show login screen
                loginScreen.show();
                // Hide settings modal
                $('#settings-modal').fadeOut();
                
                Swal.fire({
                    icon: 'success',
                    title: 'تم تسجيل الخروج بنجاح',
                    showConfirmButton: false,
                    timer: 1500
                });
            }
        });
    });

    // Update the completion message
    function showCompletionMessage() {
        Swal.fire({
            title: 'مبروك! 🎉',
            text: 'لقد أتممت ورد اليوم بنجاح',
            icon: 'success',
            confirmButtonText: 'حسناً'
        }).then(() => {
            // Any additional actions after closing the message
        });
    }
});
