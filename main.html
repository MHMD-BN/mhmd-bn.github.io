<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تَثْبِيتْ</title>
  <link rel="shortcut icon" href="logo.png" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
body {
  width: 100%;
  height: 100vh;
  padding: 0;
  margin: 0;
  background-color: #0A3A2A; /* Deep Islamic green */
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
}

.widget {
  height: 200px;
  display: flex;
  justify-content: flex-end;
  border-radius: 10px;
  background-color: #F5F0E6; /* Soft parchment color */
  position: fixed;
  bottom: 20px;
  right: 20px;
}
.widget.active .menu {
  width: 344px;
}
.widget.active .menu .toggle {
  right: 296px;
}
.widget.active .menu .toggle i {
  width: 8px;
  transition: width 400ms cubic-bezier(0.6, 0, 0.45, 0.99), transform 1000ms cubic-bezier(0.6, 0, 0.45, 0.99) 300ms, top 200ms cubic-bezier(0.6, 0, 0.45, 0.99) 200ms, bottom 200ms cubic-bezier(0.6, 0, 0.45, 0.99) 200ms;
  background-color: #D4AF37; /* Gold color */
}
.widget.active .menu .toggle i:first-of-type {
  top: 19px;
  transform: rotate(45deg) translate(-1px, -2px);
}
.widget.active .menu .toggle i:last-of-type {
  bottom: 19px;
  transform: rotate(-45deg) translate(-1px, 2px);
}
.widget.active .menu .list {
  visibility: visible;
  flex-direction: row-reverse;
}
.widget.active .menu .list li {
  transform: scale(1);
  cursor: pointer;
}
.widget .menu {
  width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: absolute;
  border-radius: 100px;
  background-color: #1B4F3E; /* Rich Islamic green */
  transform: translate(28px, -50%);
  box-shadow: 0px 10px 30px -15px rgba(0, 0, 0, 0.5);
  transition: 650ms cubic-bezier(0.79, 0, 0.22, 1);
  bottom: 0;
  right: 20;
}
.widget .menu .toggle {
  width: 40px;
  height: 40px;
  right: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  position: absolute;
  border-radius: 100px;
  cursor: pointer;
  z-index: 100;
  background-color: #1B4F3E; /* Matching green */
  transition: 600ms cubic-bezier(0.79, 0, 0.22, 1);
}
.widget .menu .toggle:hover {
  background-color: #0A3A2A; /* Darker shade */
}
.widget .menu .toggle i {
  width: 12px;
  height: 2px;
  position: absolute;
  display: flex;
  border-radius: 100px;
  background-color: #D4AF37; /* Gold color */
  transition: width 400ms cubic-bezier(0.6, 0, 0.45, 0.99), transform 600ms cubic-bezier(0.6, 0, 0.45, 0.99), top 600ms cubic-bezier(0.6, 0, 0.45, 0.99) 600ms, bottom 600ms cubic-bezier(0.6, 0, 0.45, 0.99) 600ms;
}
.widget .menu .toggle i:first-of-type {
  top: 16px;
}
.widget .menu .toggle i:last-of-type {
  bottom: 16px;
}
.widget .menu .list {
  flex-direction: row;
  margin: 0;
  right: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  visibility: hidden;
  position: absolute;
}
.widget .menu .list li {
  width: 40px;
  height: 40px;
  margin-left: 8px;
  list-style: none;
  border-radius: 100px;
  transform: scale(0);
  transition: 300ms cubic-bezier(0.37, 0.01, 0.43, 1.3);
  transition-delay: 300ms;
  background-color: #1B4F3E; /* Matching green */
}
.widget .menu .list li:hover{
  background-color: #0A3A2A; /* Darker shade */
}
.widget .menu .list li i{
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #F5F0E6; /* Soft parchment color */
  font-size: 20px;
}
.widget .menu .list li:nth-child(1) {
  transition-delay: 50ms;
}
.widget .menu .list li:nth-child(2) {
  transition-delay: 100ms;
}
.widget .menu .list li:nth-child(3) {
  transition-delay: 150ms;
}
.widget .menu .list li:nth-child(4) {
  transition-delay: 200ms;
}
.widget .menu .list li:nth-child(5) {
  transition-delay: 250ms;
}
.widget .menu .list li:nth-child(6) {
  transition-delay: 300ms;
}
iframe{
  width: 100%;
  height: 100%;
  position: absolute;
  z-index: 1;
}
.widget{
  z-index: 2;
}
</style>
</head>
<body>
<div class="widget">
  <div class="menu">
    <div class="toggle"><i></i><i></i></div>
    <ul class="list">
      <li data-target="Quran/index.html" title="حفظ"><i class="fas fa-book-open"></i></li>
      <li data-target="listen/index.html" title="الأستماع الممنهج"><i class="fas fa-headphones"></i></li>
      <li data-target="index.html" title="تفسير"><i class="fas fa-scroll"></i></li>
      <li data-target="repeat.html" title="تكرار"><i class="fas fa-redo"></i></li>
      <li data-target="Quran/review/index.html" title="مراجعة"><i class="fas fa-check-circle"></i></li>
      <li data-target="profile.html" title="ملف شخصي"><i class="fa-solid fa-user"></i></li>
    </ul>
  </div>
</div>
<iframe src="Quran/index.html" frameborder="0" id="iframe"></iframe>
<script>
const widget = document.querySelector('.widget')
const toggle = document.querySelector('.toggle')
const iframe = document.querySelector("#iframe")
const btns = document.querySelectorAll(".list li")
for (let i = 0; i < btns.length; i++) {
  const element = btns[i];
  element.addEventListener("click",() => {
    iframe.src = element.dataset.target;
    widget.classList.remove('active')
  });
}

toggle.addEventListener('click', () => {
  widget.classList.toggle('active')
})

</script>


  
</body>
</html>
